  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function obterMensagemErroGemini(status, data, rawText) {
    const apiMessage =
      data?.error?.message ||
      data?.message ||
      data?.promptFeedback?.blockReason ||
      rawText ||
      "Falha ao comunicar com a API do Gemini.";

    return `HTTP ${status} - ${apiMessage}`;
  }

  async function chamarGemini(parts, generationConfig = null) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(GEMINI_MODEL)}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;

    const payload = {
      contents: [
        {
          role: "user",
          parts
        }
      ]
    };

    if (generationConfig) {
      payload.generationConfig = generationConfig;
    }

    const resposta = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const rawText = await resposta.text();
    let data = {};

    try {
      data = rawText ? JSON.parse(rawText) : {};
    } catch {
      data = {};
    }

    if (!resposta.ok) {
      throw new Error(obterMensagemErroGemini(resposta.status, data, rawText));
    }

    return data;
  }

  function extrairTextoDaRespostaGemini(data) {
    const candidate = data?.candidates?.[0];
    const parts = candidate?.content?.parts || [];
    const text = parts.map((p) => p?.text || "").join("").trim();

    if (text) return text;

    const blockReason = data?.promptFeedback?.blockReason;
    const finishReason = candidate?.finishReason;

    if (blockReason) {
      throw new Error(`Resposta bloqueada: ${blockReason}`);
    }

    if (finishReason) {
      throw new Error(`Resposta vazia da IA (${finishReason})`);
    }

    throw new Error("Resposta vazia da IA.");
  }

  async function obterDadosImagemSeguro(urlOuBase64) {
    if (!urlOuBase64 || typeof urlOuBase64 !== "string") return null;

    if (urlOuBase64.startsWith("data:image")) {
      try {
        const mime = urlOuBase64.split(";")[0].split(":")[1] || "image/jpeg";
        const base64Limpo = urlOuBase64.split(",")[1];
        if (!base64Limpo) return null;
        return { mime_type: mime, data: base64Limpo };
      } catch {
        return null;
      }
    }

    if (urlOuBase64.startsWith("http")) {
      try {
        const resposta = await fetch(urlOuBase64);
        if (!resposta.ok) return null;

        const blob = await resposta.blob();

        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            try {
              const result = String(reader.result || "");
              const base64 = result.split(",")[1];
              resolve(base64 ? { mime_type: blob.type || "image/jpeg", data: base64 } : null);
            } catch {
              resolve(null);
            }
          };
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        console.warn("Não foi possível converter imagem remota para base64:", e);
        return null;
      }
    }

    return null;
  }

  function normalizarNumeroMoeda(valor) {
    if (!valor) return 0;
    if (typeof valor === "number") return valor;

    const limpo = String(valor)
      .replace(/\s/g, "")
      .replace("R$", "")
      .replace(/\./g, "")
      .replace(",", ".");

    const numero = parseFloat(limpo);
    return Number.isNaN(numero) ? 0 : numero;
  }

    if (processo?.tipo === "🚨 DENÚNCIA") return "denuncia";

  const fireQuery = query(collection(db, "pedidos"), orderBy("data", "desc"));

  onSnapshot(fireQuery, (snapshot) => {
    todosProcessos = [];

    let countPendentes = 0;
    let countAguardando = 0;
    let countPagos = 0;
    let totalReceita = 0;
    let pendenteReceita = 0;

    const chatSelect = document.getElementById("chat-process-selector");
    if (chatSelect) {
      chatSelect.innerHTML = '<option value="">Geral (Falar apenas sobre Leis)</option>';

      dados.id = docSnap.id;
      todosProcessos.push(dados);

      const valorNum = normalizarNumeroMoeda(dados.valor);
      const status = obterStatusProcesso(dados);

      if (status === "pago") {
        countPagos++;
        totalReceita += valorNum;
      } else if (status === "aguardando") {
        countAguardando++;
        pendenteReceita += valorNum;

        countPendentes++;

        option.textContent = `${dados.nome} (${dados.cnpj || "Sem documento"})`;

    renderizarTabelas(todosProcessos);
    atualizarMapaDeCalor(todosProcessos);
  });

  window.renderizarTabelas = (arrayDeDados) => {

    tbFull.innerHTML = "";

      return;

    arrayDeDados.forEach((processo, index) => {

      `;
      tbFull.appendChild(trCompleta);

      if (index < 5) {
        const trResumo = document.createElement("tr");
        trResumo.innerHTML = htmlColunaBase + `
          <td><button class="btn-icon view" onclick="abrirModal('${escapeHtml(processo.id)}')" style="width:100%; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--accent);"><i class="fas fa-arrow-right"></i> Avaliar</button></td>
        `;
        tbDash.appendChild(trResumo);
      }
    });
  };

  function atualizarMapaDeCalor(dados) {
    const mapaContainer = document.getElementById("mapa-zonas-reais");
    if (!mapaContainer) return;

    const zonas = {
      "Sul (Grajaú)": 0,
      "Centro (Sé)": 0,
      "Leste (Itaquera)": 0,
      "Norte (Santana)": 0,
      "Oeste (Pinheiros)": 0
    };

    let totalProblemas = 0;

    dados.forEach((p) => {
      if (p.tipo === "🚨 DENÚNCIA" || (!p.pago && !p.valor)) {
        totalProblemas++;
        const hash = p.cnpj ? parseInt(String(p.cnpj).replace(/\D/g, "").substring(0, 2), 10) || 0 : 0;

        if (hash < 25) zonas["Sul (Grajaú)"]++;
        else if (hash < 50) zonas["Centro (Sé)"]++;
        else if (hash < 70) zonas["Leste (Itaquera)"]++;
        else if (hash < 85) zonas["Norte (Santana)"]++;
        else zonas["Oeste (Pinheiros)"]++;
      }
    });

    if (totalProblemas === 0) totalProblemas = 1;

    mapaContainer.innerHTML = "";

    const zonasArray = Object.keys(zonas)
      .map((nome) => ({ nome, valor: zonas[nome] }))
      .sort((a, b) => b.valor - a.valor);

    zonasArray.forEach((z) => {
      let porcentagem = Math.round((z.valor / totalProblemas) * 100);

      let cor = "var(--success)";
      let icone = "fa-shield-alt";
      let textoStatus = "Estável / Monitorado";

      if (porcentagem > 15) {
        cor = "var(--warning)";
        icone = "fa-exclamation-triangle";
        textoStatus = "Alerta Operacional";
      }

      if (porcentagem > 30) {
        cor = "var(--danger)";
        icone = "fa-fire";
        textoStatus = "Risco Crítico Iminente";
      }

      if (z.valor === 0) porcentagem = 0;

      mapaContainer.innerHTML += `
        <div class="heat-zone" style="border-bottom: 6px solid ${cor};">
          <h3 style="color:white; font-size:1.3rem; margin-bottom:10px;">Zona ${escapeHtml(z.nome)}</h3>
          <i class="fas ${icone}" style="font-size:4rem; color:${cor}; margin:25px 0; filter: drop-shadow(0 0 15px rgba(0,0,0,0.5));"></i>
          <p style="color:${cor}; font-weight:900; font-size:1.4rem;">${escapeHtml(textoStatus)}</p>
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${porcentagem}%; background:${cor};"></div></div>
          <span style="color:var(--text-muted); font-size:1rem; display:block; margin-top:15px; font-weight:bold;">${porcentagem}% das pendências da base (${z.valor} Casos)</span>
        </div>
      `;
    });
  }

  window.aplicarFiltros = () => {
    const selectStatus = document.getElementById("filtro-status")?.value || "todos";
    const selectRamo = document.getElementById("filtro-ramo")?.value || "todos";
    const inputTexto = (document.getElementById("searchInput")?.value || "").toLowerCase();

    let listaFiltrada = [...todosProcessos];

    if (inputTexto) {
      listaFiltrada = listaFiltrada.filter((p) =>
        (p.nome && String(p.nome).toLowerCase().includes(inputTexto)) ||
        (p.cnpj && String(p.cnpj).toLowerCase().includes(inputTexto))
      );
    }

    if (selectRamo !== "todos") {
      listaFiltrada = listaFiltrada.filter((p) => p.tipo === selectRamo);
    }

    if (selectStatus !== "todos") {
      if (selectStatus === "pago") listaFiltrada = listaFiltrada.filter((p) => p.pago === true);
      else if (selectStatus === "aguardando") listaFiltrada = listaFiltrada.filter((p) => p.valor && p.pago === false);
      else if (selectStatus === "pendente") listaFiltrada = listaFiltrada.filter((p) => !p.valor && p.pago === false && p.tipo !== "🚨 DENÚNCIA");
      else if (selectStatus === "denuncia") listaFiltrada = listaFiltrada.filter((p) => p.tipo === "🚨 DENÚNCIA");
    }

    renderizarTabelas(listaFiltrada);
  };

  window.filtrarTabela = window.aplicarFiltros;

    if (!todosProcessos.length) {
      showToast("Erro", "Banco de dados vazio.", "error");
      return;
    }

    let stringCSV = "Data,Razao_Social,CNPJ_CPF,Ramo,Status_Sistemico,Taxa_Valor,Observacoes_Internas\n";

    todosProcessos.forEach((p) => {
      let statusExport = p.pago ? "Aprovado" : (p.valor ? "Aguardando Pagamento" : "Analise Pendente");
      if (p.tipo === "🚨 DENÚNCIA") statusExport = "Denúncia Externa";

      const notaLimpa = p.notas ? String(p.notas).replace(/(\r\n|\n|\r)/gm, " ") : "";
      stringCSV += `"${String(p.data || "").replaceAll('"', '""')}","${String(p.nome || "").replaceAll('"', '""')}","${String(p.cnpj || "").replaceAll('"', '""')}","${String(p.tipo || "").replaceAll('"', '""')}","${statusExport}","${String(p.valor || "0").replaceAll('"', '""')}","${notaLimpa.replaceAll('"', '""')}"\n`;
    });

    const blobDownload = new Blob([stringCSV], { type: "text/csv;charset=utf-8;" });
    const linkDownload = document.createElement("a");
    linkDownload.href = URL.createObjectURL(blobDownload);
    linkDownload.download = `Base_Mestra_COVISA_${new Date().toLocaleDateString()}.csv`;
    linkDownload.click();

    registrarLog("Exportação de Dados", "A base de dados oficial foi exportada para CSV pelo administrador.");
    showToast("Download Concluído", "Base de dados exportada com sucesso.", "success");

    registrarLog("Acesso Restrito", `Auditor abriu o dossiê do processo ID: ${idDoProtocolo.substring(0, 8)}`);

    try {
      const documentoNoBanco = await getDoc(doc(db, "pedidos", idDoProtocolo));

      if (!documentoNoBanco.exists()) {
        showToast("Erro", "Processo não encontrado.", "error");
        return;
      }

      const dadosDoCliente = documentoNoBanco.data();
      dadosProcessoAtual = { ...dadosDoCliente, id: idDoProtocolo };

      document.getElementById("modal-cnpj").innerText = dadosDoCliente.cnpj || "Sem registro";
      document.getElementById("modal-nome").innerText = dadosDoCliente.nome || "Sem registro";
      document.getElementById("modal-data").innerText = dadosDoCliente.data || "Indisponível";
      document.getElementById("modal-ramo").innerText = dadosDoCliente.tipo || "Geral";
      document.getElementById("modal-docs").innerText = dadosDoCliente.docs || "Nenhum relatório declarado.";

      const galeriaHTML = document.getElementById("evidence-gallery");
      galeriaHTML.innerHTML = "";
      let totalDeArquivos = 0;

      if (dadosDoCliente.documento_assinado) {
        totalDeArquivos++;
        const htmlAssinado = document.createElement("div");
        htmlAssinado.className = "gallery-item";
        htmlAssinado.style.border = "4px solid var(--success)";
        htmlAssinado.onclick = () => abrirLightbox(dadosDoCliente.documento_assinado, "Documento Legal Assinado");
        htmlAssinado.innerHTML = `
          <div class="badge-assinado"><i class="fas fa-check-circle"></i> VALIDADO</div>
          <img src="${dadosDoCliente.documento_assinado}">
          <div class="overlay"><i class="fas fa-search-plus"></i></div>
        `;
        galeriaHTML.appendChild(htmlAssinado);
      }

      if (Array.isArray(dadosDoCliente.evidencias) && dadosDoCliente.evidencias.length > 0) {
        totalDeArquivos += dadosDoCliente.evidencias.length;

        dadosDoCliente.evidencias.forEach((fotoObject) => {
          const url = fotoObject?.url || "";
          const nome = fotoObject?.nome || "Imagem";

          const caixaDaFoto = document.createElement("div");
          caixaDaFoto.className = "gallery-item";
          caixaDaFoto.onclick = () => abrirLightbox(url, nome);
          caixaDaFoto.innerHTML = `
            <img src="${url}">
            <div class="overlay"><i class="fas fa-search-plus"></i></div>
          `;
          galeriaHTML.appendChild(caixaDaFoto);
        });
      }

      document.getElementById("evidence-title").innerText = `Evidências Fotográficas (${totalDeArquivos} arquivos anexados)`;

      document.getElementById("modal-valor-input").value = dadosDoCliente.valor || "";
      const selectStatus = dadosDoCliente.pago ? "pago" : (dadosDoCliente.valor ? "aguardando" : "pendente");
      document.getElementById("modal-status-select").value = selectStatus;
      document.getElementById("modal-notas-input").value = dadosDoCliente.notas || "";

      let textoZapOficial = `Prefeitura de São Paulo - COVISA\n*${dadosDoCliente.nome || "Contribuinte"}* - CNPJ/CPF: ${dadosDoCliente.cnpj || "Não informado"}\n\n`;
      if (selectStatus === "pendente") textoZapOficial += "Aviso: Seu processo passou pela triagem inicial e encontra-se sob análise dos fiscais da base. Por favor, aguarde novas instruções no portal.";
      if (selectStatus === "aguardando") textoZapOficial += `NOTIFICAÇÃO OFICIAL: A taxa administrativa de regularização no valor de *R$ ${dadosDoCliente.valor}* já foi emitida e aguarda pagamento. Acesse o portal e gere o seu Pix para liberação da licença sanitária.`;
      if (selectStatus === "pago") textoZapOficial += "PARABÉNS! Sua licença sanitária foi *APROVADA* e liberada no sistema. O certificado provisório está disponível para download e assinatura no portal oficial.";

      document.getElementById("modal-btn-zap").href = `https://api.whatsapp.com/send?phone=55&text=${encodeURIComponent(textoZapOficial)}`;

      iniciarRadarIAGemini();
    } catch (e) {
      console.error(e);
      showToast("Erro BD", "Não foi possível carregar os detalhes do Firebase.", "error");
    }
  };

  window.fecharModal = () => {
    document.getElementById("modalDetalhes").style.display = "none";
    idProcessoAtual = null;
    dadosProcessoAtual = null;
  };

  window.iniciarRadarIAGemini = async () => {
    const dadosDoProcesso = dadosProcessoAtual;
    if (!dadosDoProcesso) return;

    document.getElementById("radar-loader").style.display = "flex";
    document.getElementById("radar-result").style.display = "none";

    const textosLoading = [
      "Extraindo dados do processo do Firebase...",
      "Iniciando Visão Computacional Avançada nas imagens...",
      "Processando OCR (Extração de Textos das Imagens)...",
      "Cruzando informações ópticas com o Banco de Dados Cidadão...",
      "Avaliando condições visuais e físicas com o Ramo da Empresa...",
      "Construindo Laudo Forense Final..."
    ];

    const pText = document.getElementById("radar-loading-text");
    let contadorTxt = 0;

    clearInterval(loaderInterval);
    pText.innerText = textosLoading[0];

    loaderInterval = setInterval(() => {
      contadorTxt++;
      if (contadorTxt < textosLoading.length) {
        pText.innerText = textosLoading[contadorTxt];
      }
    }, 1500);

    try {
      const promptDaIA = `
ATENÇÃO: VOCÊ É UM SISTEMA DE AUDITORIA FORENSE DE ALTA PRECISÃO (Vigilância Sanitária).
Sua tarefa é analisar rigorosamente os dados e imagens fornecidos e identificar QUALQUER fraude ou divergência.

DADOS DECLARADOS PELO USUÁRIO:
- Razão Social / Nome: ${dadosDoProcesso.nome || "Não informado"}
- CNPJ / CPF: ${dadosDoProcesso.cnpj || "Não informado"}
- Ramo de Atividade: ${dadosDoProcesso.tipo || "Não informado"}
- O que ele marcou no Checklist: ${dadosDoProcesso.docs || "Nada informado"}

ANÁLISE EXIGIDA:
1. EXTRAÇÃO ÓPTICA (OCR): Se houver fotos, leia o texto visível.
2. VALIDAÇÃO DE IDENTIDADE: Os nomes ou CNPJs nas fotos batem com os dados declarados?
3. VALIDAÇÃO VISUAL: O ambiente condiz com o ramo de atividade?
4. DENÚNCIA: Se o ramo for "🚨 DENÚNCIA", a nota deve ser 0.

REGRAS DE PONTUAÇÃO:
- 80 a 100: documento bate, fotos boas e coerentes.
- 50 a 70: dados parciais, faltam imagens melhores ou do ambiente.
- 0 a 40: indício forte de fraude, ausência de fotos, incoerência grave ou denúncia.

Preencha o JSON solicitado.
      `.trim();

      const pacoteDeEnvio = [{ text: promptDaIA }];

      if (Array.isArray(dadosDoProcesso.evidencias) && dadosDoProcesso.evidencias.length > 0) {
        for (let i = 0; i < Math.min(dadosDoProcesso.evidencias.length, 3); i++) {
          const url = dadosDoProcesso.evidencias[i]?.url;
          const objImagemSegura = await obterDadosImagemSeguro(url);
          if (objImagemSegura) pacoteDeEnvio.push({ inline_data: objImagemSegura });
        }
      }

      if (dadosDoProcesso.documento_assinado) {
        const objAssinadoSeguro = await obterDadosImagemSeguro(dadosDoProcesso.documento_assinado);
        if (objAssinadoSeguro) pacoteDeEnvio.push({ inline_data: objAssinadoSeguro });
      }

      const respostaDaIA = await chamarGemini(pacoteDeEnvio, {
        response_mime_type: "application/json",
        response_schema: RADAR_SCHEMA,
        temperature: 0.2
      });

      let textoDoGemini = extrairTextoDaRespostaGemini(respostaDaIA);
      let resultadoJson = null;

      try {
        resultadoJson = JSON.parse(textoDoGemini);
      } catch {
        const matchJson = textoDoGemini.match(/\{[\s\S]*\}/);
        if (!matchJson) throw new Error("A IA gerou uma resposta que não é JSON reconhecível.");
        resultadoJson = JSON.parse(matchJson[0]);
      }

      let suspeitaDeClone = false;
      if (Array.isArray(dadosDoProcesso.evidencias) && dadosDoProcesso.evidencias.length > 0 && todosProcessos.length > 1) {
        const fotoAtual = dadosDoProcesso.evidencias[0]?.url || "";
        const tamanhoDaFotoAtual = fotoAtual.length;

        for (const processoAntigo of todosProcessos) {
          if (processoAntigo.id !== dadosDoProcesso.id && Array.isArray(processoAntigo.evidencias)) {
            for (const imagemAntiga of processoAntigo.evidencias) {
              if ((imagemAntiga?.url || "").length === tamanhoDaFotoAtual && tamanhoDaFotoAtual > 0) {
                suspeitaDeClone = true;
                break;
              }
            }
          }
          if (suspeitaDeClone) break;
        }

        if (suspeitaDeClone) {
          resultadoJson.score_confiabilidade = 5;
          resultadoJson.divergencias_encontradas = "MOTOR DO SERVIDOR (ALERTA VERMELHO): A imagem anexada tem o tamanho binário exato de uma evidência utilizada por outro CNPJ no sistema no passado. Fraude fotográfica comprovada.";
          resultadoJson.veredito_final = "BLOQUEIO IMEDIATO (CRIME)";
        }
      }

      setTimeout(() => {
        clearInterval(loaderInterval);
        renderizarRadarNaTela(resultadoJson);
        registrarLog("Laudo Forense (IA)", `Gemini processou o caso de ${dadosDoProcesso.cnpj || "sem documento"} com score de confiabilidade de ${resultadoJson.score_confiabilidade}%.`);
      }, 1500);
    } catch (error) {
      console.error("Falha Sistêmica no Gemini:", error);

      let notasFallback = {
        score_confiabilidade: 90,
        verificacao_documental: `Modo Offline ativo. ${error?.message || "A API recusou a conexão."}`,
        inspecao_visual: "Inspeção por visão computacional indisponível momentaneamente. As fotos constam no banco mas não puderam ser lidas pela IA.",
        divergencias_encontradas: "A API do Google falhou, porém os documentos básicos parecem ter sido enviados. Recomenda-se verificação humana das imagens na aba ao lado.",
        veredito_final: "APROVAÇÃO VIRTUAL"
      };

      if (dadosDoProcesso.tipo === "🚨 DENÚNCIA") {
        notasFallback.score_confiabilidade = 0;
        notasFallback.veredito_final = "INTERDIÇÃO CAUTELAR";
        notasFallback.divergencias_encontradas = "Processo trata-se de denúncia reportada pelo cidadão. Risco severo à saúde da população. Exige intervenção imediata.";
      } else if (!Array.isArray(dadosDoProcesso.evidencias) || dadosDoProcesso.evidencias.length === 0) {
        notasFallback.score_confiabilidade = 10;
        notasFallback.veredito_final = "REPROVAR E BLOQUEAR";
        notasFallback.divergencias_encontradas = "O requerente não enviou nenhuma foto ou comprovante visual. É impossível expedir licença às cegas.";
      } else if (dadosDoProcesso.evidencias.length === 1) {
        notasFallback.score_confiabilidade = 40;
        notasFallback.veredito_final = "REVISÃO OBRIGATÓRIA (FALTAM PROVAS)";
        notasFallback.divergencias_encontradas = "O requerente anexou apenas 1 imagem. Isso não prova que o ambiente é seguro.";
      }

      setTimeout(() => {
        clearInterval(loaderInterval);
        renderizarRadarNaTela(notasFallback);
      }, 1500);
    }
  };

  function renderizarRadarNaTela(dadosIA) {
    document.getElementById("radar-loader").style.display = "none";
    document.getElementById("radar-result").style.display = "grid";

    const notaFinal = parseInt(dadosIA?.score_confiabilidade, 10) || 0;
    const circuloScore = document.getElementById("radar-score-circle");
    const txtNumeroScore = document.getElementById("radar-score-number");
    const txtNivelQualidade = document.getElementById("radar-nivel-text");

    let corEscolhida = "var(--danger)";
    let nivelTexto = "RISCO CRÍTICO / FRAUDE";

    if (notaFinal >= 50) {
      corEscolhida = "var(--warning)";
      nivelTexto = "PROVAS FRACAS (REVISAR)";
    }

    if (notaFinal >= 80) {
      corEscolhida = "var(--success)";
      nivelTexto = "DADOS VÁLIDOS (APROVAR)";
    }

    circuloScore.style.borderColor = corEscolhida;
    txtNumeroScore.style.color = corEscolhida;
    txtNivelQualidade.style.color = corEscolhida;
    txtNivelQualidade.innerText = nivelTexto;

    document.getElementById("radar-doc-check").textContent = dadosIA?.verificacao_documental || "Sem retorno.";
    document.getElementById("radar-visual-check").textContent = dadosIA?.inspecao_visual || "Sem retorno.";
    document.getElementById("radar-risk-check").textContent = dadosIA?.divergencias_encontradas || "Sem retorno.";
    document.getElementById("radar-recommendation-text").innerText = dadosIA?.veredito_final || "REVISAR MANUALMENTE";

    let contadorAparente = 0;
    const intervaloEfeito = setInterval(() => {
      contadorAparente += Math.ceil(notaFinal / 15) + 1;
      if (contadorAparente >= notaFinal) {
        contadorAparente = notaFinal;
        clearInterval(intervaloEfeito);
      }
      txtNumeroScore.innerText = contadorAparente;
    }, 30);
  }

  window.salvarEdicaoModal = async () => {
    if (!idProcessoAtual) return;

    const botaoDeSalvar = document.getElementById("btn-salvar-modal");
    botaoDeSalvar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sincronizando BD Central...';

    let valorInputado = document.getElementById("modal-valor-input").value;
    const statusSelecionado = document.getElementById("modal-status-select").value;
    const notasDigitadas = document.getElementById("modal-notas-input").value;

    let flagPago = false;
    if (statusSelecionado === "pago") flagPago = true;
    if (statusSelecionado === "pendente") valorInputado = null;

    try {
      await updateDoc(doc(db, "pedidos", idProcessoAtual), {
        valor: valorInputado,
        pago: flagPago,
        notas: notasDigitadas
      });

      showToast("Veredito Finalizado", "A base de dados foi atualizada com sucesso.", "success");
      registrarLog("Autuação/Veredito Executado", `Protocolo de ID ${idProcessoAtual.substring(0, 8)} modificado para o status sistêmico: ${statusSelecionado.toUpperCase()}`);
      fecharModal();
    } catch (erroDeRede) {
      console.error(erroDeRede);
      showToast("Falha Crítica", "Acesso negado no banco de dados da nuvem.", "error");
      botaoDeSalvar.innerHTML = '<i class="fas fa-save"></i> Tentar Gravar Novamente';
    }
  };

  window.deletarProcessoAtual = async () => {
    if (!idProcessoAtual) return;

    if (confirm("COMANDO IRREVERSÍVEL DA JUSTIÇA:\nDeseja destruir as informações deste processo permanentemente da base governamental? Não existe botão de desfazer.")) {
      try {
        await deleteDoc(doc(db, "pedidos", idProcessoAtual));
        showToast("Base Limpa", "O dossiê foi erradicado do sistema.", "success");
        registrarLog("Destruição de Dossiê", `O documento mestre do processo ID: ${idProcessoAtual.substring(0, 8)} foi desintegrado sem deixar rastros operacionais.`);
        fecharModal();
      } catch (e) {
        console.error(e);
        showToast("Erro", "Não foi possível excluir o processo.", "error");
      }
    }
  };

  window.enviarChat = async () => {
    const campoDeTexto = document.getElementById("chat-input-text");
    const perguntaDoFiscal = (campoDeTexto?.value || "").trim();
    if (!perguntaDoFiscal) return;

    const areaHistorico = document.getElementById("chat-historico");

    const bolhaUser = document.createElement("div");
    bolhaUser.className = "chat-msg msg-user";
    bolhaUser.innerText = perguntaDoFiscal;
    areaHistorico.appendChild(bolhaUser);

    campoDeTexto.value = "";
    areaHistorico.scrollTop = areaHistorico.scrollHeight;

    const idLoaderChat = "loader_" + Date.now();
    const bolhaLoader = document.createElement("div");
    bolhaLoader.id = idLoaderChat;
    bolhaLoader.className = "chat-msg msg-ai";
    bolhaLoader.innerHTML = `<i class="fas fa-circle-notch fa-spin" style="color:var(--gemini-purple); font-size:1.5rem; margin-right:10px;"></i> Analisando Código de Leis Municipais e Processos...`;
    areaHistorico.appendChild(bolhaLoader);
    areaHistorico.scrollTop = areaHistorico.scrollHeight;

    let promptFinal = `Aja estritamente como Advogado Chefe da Vigilância Sanitária de SP. Cite a Lei Municipal 13.725 ou resoluções da ANVISA nas respostas se necessário. O fiscal perguntou: "${perguntaDoFiscal}". Seja direto, didático e não use markdown.`;

    const idProcessoSelecionadoNoChat = document.getElementById("chat-process-selector")?.value || "";

    if (idProcessoSelecionadoNoChat) {
      const p = todosProcessos.find((proc) => proc.id === idProcessoSelecionadoNoChat);
      if (p) {
        promptFinal = `Aja como Auditor Chefe da Vigilância Sanitária de SP. O fiscal selecionou a empresa "${p.nome}" (CNPJ: ${p.cnpj}, Ramo: ${p.tipo}). O checklist alegado foi: ${p.docs}. Mensagem do fiscal sobre este caso: "${perguntaDoFiscal}". Faça um resumo crítico focado no que ele pediu e cite leis de punição se houver infração aparente. Responda em texto puro, sem asteriscos.`;
      }
    }

    try {
      const respostaCompleta = await chamarGemini([{ text: promptFinal }], {
        temperature: 0.4
      });

      const loaderElement = document.getElementById(idLoaderChat);
      if (loaderElement) loaderElement.remove();

      let textoDoAssistente = extrairTextoDaRespostaGemini(respostaCompleta);
      textoDoAssistente = textoDoAssistente.replace(/\*\*/g, "").replace(/\*/g, "").trim();

      const bolhaIA = document.createElement("div");
      bolhaIA.className = "chat-msg msg-ai";
      bolhaIA.innerHTML = `<strong style="color:var(--gemini-purple); font-size:1.1rem;"><i class="fas fa-robot"></i> Parecer Oficial Gemini:</strong><br><br>${escapeHtml(textoDoAssistente).replace(/\n/g, "<br>")}`;
      areaHistorico.appendChild(bolhaIA);

      areaHistorico.scrollTop = areaHistorico.scrollHeight;
      registrarLog("Consulta Jurídica IA", "O Fiscal conversou com a Inteligência Artificial no módulo Chatbot.");
    } catch (erroNoChat) {
      console.error(erroNoChat);

      const loaderElement = document.getElementById(idLoaderChat);
      if (loaderElement) loaderElement.remove();

      const erroBolha = document.createElement("div");
      erroBolha.className = "chat-msg msg-ai";
      erroBolha.style.color = "var(--danger)";
      erroBolha.style.border = "1px solid var(--danger)";
      erroBolha.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${escapeHtml(erroNoChat?.message || "Falha de comunicação com a rede neural do Google.")}`;
      areaHistorico.appendChild(erroBolha);
      areaHistorico.scrollTop = areaHistorico.scrollHeight;
    }
  };

  window.calcularMulta = () => {
    const gravidadeDefinida = document.getElementById("sim-gravidade")?.value || "leve";
    let valorBaseEmReais = 1500;

    if (gravidadeDefinida === "grave") valorBaseEmReais = 8500;
    if (gravidadeDefinida === "gravissima") valorBaseEmReais = 35000;

    const porte = parseInt(document.getElementById("sim-porte")?.value || "1", 10);
    valorBaseEmReais = valorBaseEmReais * porte;

    if (document.getElementById("sim-reincidente")?.checked) {
      valorBaseEmReais = valorBaseEmReais * 2;
    }

    const out = document.getElementById("sim-resultado");
    if (out) {
      out.innerText = "R$ " + valorBaseEmReais.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
    }
  };

  function initCharts() {
    try {
      if (!chartBar) {
        const contextoBarra = document.getElementById("barChart")?.getContext("2d");
        if (contextoBarra) {
          chartBar = new Chart(contextoBarra, {
            type: "line",
            data: {
              labels: ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"],
              datasets: [{
                label: "Cadastros e Entradas",
                data: [0, 0, 0, 0, 0, 0, 0],
                borderColor: "#3b82f6",
                backgroundColor: "rgba(59, 130, 246, 0.2)",
                fill: true,
                tension: 0.4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: "rgba(255,255,255,0.05)" } },
                x: { grid: { display: false } }
              }
            }
          });
        }
      }

      if (!chartDoughnut) {
        const contextoRosca = document.getElementById("doughnutChart")?.getContext("2d");
        if (contextoRosca) {
          chartDoughnut = new Chart(contextoRosca, {
            type: "doughnut",
            data: {
              labels: ["Aprovados e Pagos", "Taxas Aguardando", "Casos de Risco"],
              datasets: [{
                data: [1, 1, 1],
                backgroundColor: ["#10b981", "#0ea5e9", "#ef4444"],
                borderWidth: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: "75%",
              plugins: { legend: { display: false } }
            }
          });
        }
      }
    } catch (err) {
      console.warn("Módulo de gráficos não pôde ser carregado na inicialização.", err);
    }
  }

  function updateCharts(pen, agu, pag) {
    if (chartDoughnut) {
      chartDoughnut.data.datasets[0].data = [pag, agu, pen];
      chartDoughnut.update();
    }

    if (chartBar) {
      const totalProcessos = pen + agu + pag;
      chartBar.data.datasets[0].data = [
        Math.floor(totalProcessos * 0.1),
        Math.floor(totalProcessos * 0.3),
        Math.floor(totalProcessos * 0.2),
        Math.floor(totalProcessos * 0.1),
        totalProcessos,
        0,
        0
      ];
      chartBar.update();
    }
  }

  window.abrirLightbox = (linkImagem, tituloDaImagem) => {
    document.getElementById("lightbox-img").src = linkImagem;
    document.getElementById("lightbox-title").innerText = tituloDaImagem;
    document.getElementById("lightbox").style.display = "flex";
  };

  window.fecharLightbox = () => {
    document.getElementById("lightbox").style.display = "none";
  };
</script>

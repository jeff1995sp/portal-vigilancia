<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - COVISA</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #f1f5f9; color: #1e293b; margin: 0; padding: 0; }
    header { background: #0f172a; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    header h1 { margin: 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
    header h1 i { color: #da251c; }
    .btn-voltar { background: #334155; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; transition: 0.2s; }
    .btn-voltar:hover { background: #475569; }

    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    
    .dashboard-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 5px solid #0284c7; }
    .card h3 { margin: 0 0 10px 0; font-size: 1rem; color: #64748b; text-transform: uppercase; }
    .card p { margin: 0; font-size: 2rem; font-weight: 900; color: #0f172a; }

    .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
    .table-header { padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .table-header h2 { margin: 0; font-size: 1.25rem; }
    .btn-limpar { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-limpar:hover { background: #dc2626; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 0.85rem; }
    tr:hover { background: #f8fafc; }
    
    .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    .status-pendente { background: #fef3c7; color: #d97706; }
    .status-liberado { background: #dcfce3; color: #166534; }

    .input-valor { padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; width: 100px; font-weight: bold; }
    .btn-salvar { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-salvar:hover { background: #0369a1; }

    .empty-state { text-align: center; padding: 50px; color: #94a3b8; }
    .empty-state i { font-size: 3rem; margin-bottom: 15px; }
  </style>
</head>
<body>

  <header>
    <h1><i class="fas fa-shield-alt"></i> Painel Administrativo COVISA</h1>
    <a href="index.html" class="btn-voltar"><i class="fas fa-home"></i> Voltar ao Site</a>
  </header>

  <div class="container">
    <div class="dashboard-cards">
      <div class="card" style="border-left-color: #f59e0b;">
        <h3>Aguardando Análise</h3>
        <p id="count-pendente">0</p>
      </div>
      <div class="card" style="border-left-color: #10b981;">
        <h3>Taxas Liberadas</h3>
        <p id="count-liberado">0</p>
      </div>
      <div class="card" style="border-left-color: #6366f1;">
        <h3>Total de Cadastros</h3>
        <p id="count-total">0</p>
      </div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h2>Gerenciamento de Taxas e Multas</h2>
        <button class="btn-limpar" onclick="limparRegistros()"><i class="fas fa-trash"></i> Limpar Histórico</button>
      </div>
      
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>CNPJ / Nome</th>
            <th>Documentos / Tipo</th>
            <th>Status</th>
            <th>Atribuir Valor (R$)</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          </tbody>
      </table>
    </div>
  </div>

  <script>
    // Carrega os dados salvos pelo cliente no index.html (usando o LocalStorage)
    function carregarDados() {
      const corpoTabela = document.getElementById('tabela-corpo');
      let pedidos = JSON.parse(localStorage.getItem('covisa_pedidos')) || {};
      
      corpoTabela.innerHTML = '';
      let contPendente = 0;
      let contLiberado = 0;
      let chaves = Object.keys(pedidos);

      if(chaves.length === 0) {
        corpoTabela.innerHTML = `<tr><td colspan="5" class="empty-state"><i class="fas fa-inbox"></i><br>Nenhum formulário recebido ainda.</td></tr>`;
      } else {
        chaves.reverse().forEach(cnpj => {
          let req = pedidos[cnpj];
          
          let classeStatus = req.valor ? 'status-liberado' : 'status-pendente';
          let txtStatus = req.valor ? 'Aguardando Pgto' : 'Análise Pendente';
          
          if(!req.valor) contPendente++; else contLiberado++;

          // Cria a linha da tabela
          let tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-size: 0.85rem; color: #64748b;">${req.data || 'Recente'}</td>
            <td><strong>${req.nome}</strong><br><small style="color:#64748b;">${cnpj}</small></td>
            <td><span style="font-weight:bold; font-size:0.85rem;">${req.tipo}</span><br><small style="color:#64748b;">Docs: ${req.docs.substring(0,30)}...</small></td>
            <td><span class="status-badge ${classeStatus}">${txtStatus}</span></td>
            <td>
              <div style="display:flex; gap: 8px;">
                <input type="text" id="valor-${cnpj}" class="input-valor" placeholder="Ex: 137,90" value="${req.valor || ''}">
                <button class="btn-salvar" onclick="salvarValor('${cnpj}')"><i class="fas fa-check"></i> Salvar</button>
              </div>
            </td>
          `;
          corpoTabela.appendChild(tr);
        });
      }

      // Atualiza os contadores
      document.getElementById('count-total').innerText = chaves.length;
      document.getElementById('count-pendente').innerText = contPendente;
      document.getElementById('count-liberado').innerText = contLiberado;
    }

    // Função executada quando você aperta "Salvar" na tabela
    function salvarValor(cnpj) {
      let inputValor = document.getElementById(`valor-${cnpj}`).value;
      
      if(inputValor.trim() === "") {
        alert("Digite um valor válido.");
        return;
      }

      let pedidos = JSON.parse(localStorage.getItem('covisa_pedidos')) || {};
      if(pedidos[cnpj]) {
        pedidos[cnpj].valor = inputValor;
        localStorage.setItem('covisa_pedidos', JSON.stringify(pedidos));
        alert(`Valor de R$ ${inputValor} salvo para o CNPJ ${cnpj}!\nO cliente já pode consultar e pagar no site principal.`);
        carregarDados(); // Recarrega a tabela para atualizar cores
      }
    }

    // Função para limpar o banco de dados (útil para testes)
    function limparRegistros() {
      if(confirm("Tem certeza que deseja apagar todos os registros do sistema?")) {
        localStorage.removeItem('covisa_pedidos');
        carregarDados();
      }
    }

    // Inicia a função ao carregar a página
    window.onload = carregarDados;
  </script>
</body>
</html>

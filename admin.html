<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - COVISA</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --success-hover: #059669;
      --warning: #f59e0b;
      --border: #e2e8f0;
    }

    body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
    
    /* Cabeçalho Premium */
    header { background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    header h1 { margin: 0; font-size: 1.6rem; display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: -0.5px; }
    header h1 i { color: #da251c; font-size: 1.8rem; }
    .btn-voltar { background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .btn-voltar:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

    .container { max-width: 1300px; margin: 40px auto; padding: 0 20px; }
    
    /* Cards do Dashboard */
    .dashboard-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
    .card { background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 20px; border: 1px solid var(--border); transition: 0.3s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.06); }
    .card-icon { width: 60px; height: 60px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; }
    .card-info h3 { margin: 0 0 5px 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
    .card-info p { margin: 0; font-size: 2.2rem; font-weight: 900; color: var(--text-main); line-height: 1; }

    /* Tabela Premium */
    .table-container { background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid var(--border); overflow: hidden; }
    .table-header { padding: 25px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fff; }
    .table-header h2 { margin: 0; font-size: 1.4rem; font-weight: 800; color: var(--text-main); }
    .btn-limpar { background: #fee2e2; color: #b91c1c; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 800; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
    .btn-limpar:hover { background: #fca5a5; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 20px 30px; text-align: left; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    th { background: #f8fafc; font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
    tr { transition: 0.2s; }
    tr:hover { background: #f8fafc; }
    
    /* Badges de Status */
    .status-badge { padding: 6px 14px; border-radius: 50px; font-size: 0.75rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-pendente { background: #fef3c7; color: #b45309; }
    .status-aguardando { background: #e0f2fe; color: #0369a1; }
    .status-pago { background: #dcfce3; color: #166534; }

    /* Inputs e Botões da Tabela */
    .input-valor { padding: 10px 15px; border: 2px solid var(--border); border-radius: 8px; width: 130px; font-weight: 700; font-size: 1rem; color: var(--text-main); outline: none; transition: 0.3s; }
    .input-valor:focus { border-color: var(--primary); }
    
    .btn-salvar { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 800; transition: 0.3s; display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; }
    .btn-salvar:hover { background: var(--primary-hover); transform: translateY(-2px); }
    
    .btn-confirmar { background: var(--success); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 800; transition: 0.3s; display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; }
    .btn-confirmar:hover { background: var(--success-hover); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }

    .docs-text { font-size: 0.85rem; color: #475569; white-space: pre-line; background: #f1f5f9; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-top: 8px; max-height: 100px; overflow-y: auto; line-height: 1.5; font-weight: 500; }
    
    .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
    .empty-state i { font-size: 4rem; margin-bottom: 20px; color: #cbd5e0; }
    .empty-state h3 { font-size: 1.2rem; font-weight: 800; margin: 0; }
  </style>
</head>
<body>

  <header>
    <h1><i class="fas fa-shield-alt"></i> Painel de Controle - COVISA</h1>
    <a href="index.html" class="btn-voltar"><i class="fas fa-external-link-alt"></i> Ver Site</a>
  </header>

  <div class="container">
    <div class="dashboard-cards">
      <div class="card">
        <div class="card-icon" style="background: var(--warning);"><i class="fas fa-search"></i></div>
        <div class="card-info">
          <h3>Falta Análise</h3>
          <p id="count-pendente">0</p>
        </div>
      </div>
      <div class="card">
        <div class="card-icon" style="background: var(--primary);"><i class="fas fa-file-invoice-dollar"></i></div>
        <div class="card-info">
          <h3>Aguard. Pgto</h3>
          <p id="count-aguardando">0</p>
        </div>
      </div>
      <div class="card">
        <div class="card-icon" style="background: var(--success);"><i class="fas fa-check-double"></i></div>
        <div class="card-info">
          <h3>Pagos</h3>
          <p id="count-pago">0</p>
        </div>
      </div>
      <div class="card">
        <div class="card-icon" style="background: #475569;"><i class="fas fa-users"></i></div>
        <div class="card-info">
          <h3>Total de Cadastros</h3>
          <p id="count-total">0</p>
        </div>
      </div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h2>Gerenciamento de Taxas e Cadastros</h2>
        <button class="btn-limpar" onclick="limparRegistros()"><i class="fas fa-trash-alt"></i> Limpar Tudo</button>
      </div>
      
      <table>
        <thead>
          <tr>
            <th width="15%">Cadastro</th>
            <th width="20%">Estabelecimento</th>
            <th width="35%">Análise Documental</th>
            <th width="12%">Status</th>
            <th width="18%">Ação</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          </tbody>
      </table>
    </div>
  </div>

  <script>
    function carregarDados() {
      const corpoTabela = document.getElementById('tabela-corpo');
      let pedidos = JSON.parse(localStorage.getItem('covisa_pedidos')) || {};
      
      corpoTabela.innerHTML = '';
      let contPendente = 0; let contAguardando = 0; let contPago = 0;
      let chaves = Object.keys(pedidos);

      if(chaves.length === 0) {
        corpoTabela.innerHTML = `<tr><td colspan="5" class="empty-state"><i class="fas fa-folder-open"></i><h3>Nenhum registro encontrado</h3><p>Os formulários enviados pelos clientes aparecerão aqui.</p></td></tr>`;
      } else {
        chaves.reverse().forEach(cnpj => {
          let req = pedidos[cnpj];
          
          let classeStatus, txtStatus, iconStatus, acoesHtml;

          if (req.pago) {
            contPago++;
            classeStatus = 'status-pago';
            iconStatus = 'fa-check-circle';
            txtStatus = 'Confirmado';
            acoesHtml = `<span style="color: var(--success); font-weight: 900; font-size: 0.95rem;"><i class="fas fa-shield-check"></i> Processo Liberado</span>`;
          } else if (req.valor) {
            contAguardando++;
            classeStatus = 'status-aguardando';
            iconStatus = 'fa-clock';
            txtStatus = 'Aguardando Pix';
            acoesHtml = `
              <div style="display:flex; flex-direction: column; gap: 8px;">
                <span style="font-weight: 800; color: var(--text-main); font-size: 0.95rem;">Valor: R$ ${req.valor}</span>
                <button class="btn-confirmar" onclick="confirmarPagamento('${cnpj}')"><i class="fas fa-check"></i> Confirmar Pgto</button>
              </div>
            `;
          } else {
            contPendente++;
            classeStatus = 'status-pendente';
            iconStatus = 'fa-exclamation-circle';
            txtStatus = 'Falta Valor';
            acoesHtml = `
              <div style="display:flex; flex-direction: column; gap: 8px;">
                <input type="text" id="valor-${cnpj}" class="input-valor" placeholder="Ex: 137,90">
                <button class="btn-salvar" onclick="salvarValor('${cnpj}')"><i class="fas fa-paper-plane"></i> Enviar Cobrança</button>
              </div>
            `;
          }

          let tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong style="font-size: 1rem; color: var(--primary);">${cnpj}</strong><br><small style="color: var(--text-muted); font-weight: 600;">${req.data || 'Recente'}</small></td>
            <td><strong style="font-size: 1.05rem;">${req.nome}</strong><br><span style="color:var(--text-muted); font-size: 0.85rem; font-weight: 600;">Ramo: ${req.tipo}</span></td>
            <td>
              <div class="docs-text">${req.docs}</div>
            </td>
            <td><span class="status-badge ${classeStatus}"><i class="fas ${iconStatus}"></i> ${txtStatus}</span></td>
            <td>${acoesHtml}</td>
          `;
          corpoTabela.appendChild(tr);
        });
      }
      
      document.getElementById('count-total').innerText = chaves.length;
      document.getElementById('count-pendente').innerText = contPendente;
      document.getElementById('count-aguardando').innerText = contAguardando;
      document.getElementById('count-pago').innerText = contPago;
    }

    function salvarValor(cnpj) {
      let inputValor = document.getElementById(`valor-${cnpj}`).value;
      if(inputValor.trim() === "") { alert("Digite um valor válido para cobrar do cliente."); return; }

      let pedidos = JSON.parse(localStorage.getItem('covisa_pedidos')) || {};
      if(pedidos[cnpj]) {
        pedidos[cnpj].valor = inputValor;
        localStorage.setItem('covisa_pedidos', JSON.stringify(pedidos));
        carregarDados();
      }
    }

    function confirmarPagamento(cnpj) {
      if(confirm("Tem certeza que deseja confirmar o pagamento deste cliente? Isso liberará o processo no site principal.")) {
        let pedidos = JSON.parse(localStorage.getItem('covisa_pedidos')) || {};
        if(pedidos[cnpj]) {
          pedidos[cnpj].pago = true;
          localStorage.setItem('covisa_pedidos', JSON.stringify(pedidos));
          carregarDados();
        }
      }
    }

    function limparRegistros() {
      if(confirm("ATENÇÃO: Tem certeza que deseja APAGAR TODOS os registros do sistema? Esta ação não pode ser desfeita.")) {
        localStorage.removeItem('covisa_pedidos');
        carregarDados();
      }
    }
    
    window.onload = carregarDados;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Admin Pedidos | MAIS Q Hambúrguer</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
:root{--bg:#050505;--card:#141414;--card2:#101010;--text:#fff;--muted:#b0b0b0;--primary:#FFC107;--ok:#00E676;--danger:#FF1744;--radius:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Open Sans',sans-serif;min-height:100vh;padding:18px 14px 60px}
h1,h2{font-family:'Montserrat',sans-serif}
.topbar{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.45);flex:0 0 auto}
.logo img{width:100%;height:100%;object-fit:cover}
.tt{font-weight:900;letter-spacing:.6px;text-transform:uppercase;font-size:15px}
.sub{color:#9a9a9a;font-size:12px;margin-top:2px}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);color:#fff;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:10px}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:rgba(255,193,7,.12);border-color:rgba(255,193,7,.35);color:var(--primary)}
.btn.ok{background:rgba(0,230,118,.12);border-color:rgba(0,230,118,.35);color:var(--ok)}
.btn.danger{background:rgba(255,23,68,.12);border-color:rgba(255,23,68,.35);color:#ffb3b8}
.wrap{max-width:1200px;margin:16px auto 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pill{padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);font-weight:900;cursor:pointer;color:#ddd}
.pill.active{border-color:rgba(255,193,7,.45);background:rgba(255,193,7,.10);color:var(--primary)}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.35)}
.search input{flex:1;background:transparent;border:none;outline:none;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:14px}
.card{background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:10px;margin-bottom:10px}
.code{font-weight:900;font-family:'Montserrat',sans-serif}
.time{color:#9a9a9a;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);font-weight:900;font-size:12px}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.recebido{color:var(--ok);border-color:rgba(0,230,118,.25);background:rgba(0,230,118,.08)}
.badge.preparo{color:var(--primary);border-color:rgba(255,193,7,.25);background:rgba(255,193,7,.08)}
.badge.saiu{color:var(--primary);border-color:rgba(255,193,7,.25);background:rgba(255,193,7,.08)}
.badge.finalizado{color:#c9c9c9}
.info{color:#ddd;font-size:13px;line-height:1.4}
.itens{margin-top:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}
.itens .i{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.itens .i:last-child{border-bottom:none}
.obs{font-size:11px;color:var(--primary);margin-top:2px}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:900}
.total span:last-child{color:var(--primary)}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.buttons .btn{flex:1;justify-content:center;min-width:140px}
#printable{display:none}
@media print{
  body *{visibility:hidden}
  #printable, #printable *{visibility:visible}
  #printable{display:block;position:absolute;left:0;top:0;width:58mm;color:#000;font-family:'Courier New',monospace;font-size:12px;padding:6px}
  .ticket-divider{border-top:1px dashed #000;margin:6px 0}
  .ticket-header{text-align:center;font-weight:bold;font-size:14px;margin-bottom:6px}
  .ticket-item{display:flex;justify-content:space-between}
}
.note{max-width:1200px;margin:10px auto 0;color:#9a9a9a;font-size:12px;line-height:1.4}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo"><img src="imagens/logo_quadrada.jpeg" alt="Logo" onerror="this.style.display='none'"></div>
    <div>
      <div class="tt">Admin Pedidos</div>
      <div class="sub">MAIS Q Hambúrguer</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-house"></i> Cardápio</button>
    <button class="btn primary" onclick="ativarSom()"><i class="fa-solid fa-volume-high"></i> Ativar Som</button>
    <button class="btn" onclick="toggleFinalizados()"><i class="fa-solid fa-filter"></i> Mostrar finalizados</button>
  </div>
</div>

<div class="wrap">
  <div class="filters">
    <div class="pill active" data-f="all" onclick="setFilter('all', this)">Todos</div>
    <div class="pill" data-f="recebido" onclick="setFilter('recebido', this)">Recebidos</div>
    <div class="pill" data-f="preparo" onclick="setFilter('preparo', this)">Em preparo</div>
    <div class="pill" data-f="saiu" onclick="setFilter('saiu', this)">Saiu</div>
    <div class="pill" data-f="finalizado" onclick="setFilter('finalizado', this)">Finalizados</div>
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="Buscar por código, nome, bairro..." oninput="render()"></div>
  </div>

  <div id="grid" class="grid">
    <div style="color:#777">Carregando pedidos...</div>
  </div>
</div>

<div class="note">
  Dica: deixe este painel aberto em uma aba no computador da loja. O som só toca depois de clicar em “Ativar Som”.
</div>

<div id="printable"></div>
<audio id="beep" src="https://cdn.pixabay.com/audio/2022/03/15/audio_7314757c4b.mp3" preload="auto"></audio>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBvNvJok9DZkbZ1XsYtnG0rvFsfKOY1LJs",
    authDomain: "maisqhamburguer-8bdc7.firebaseapp.com",
    projectId: "maisqhamburguer-8bdc7",
    storageBucket: "maisqhamburguer-8bdc7.firebasestorage.app",
    messagingSenderId: "1071569766704",
    appId: "1:1071569766704:web:c504658155cf2199d5a0f5"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}


// ===== SOM (WebAudio - não precisa arquivo) =====
let __audioCtx = null;
let __soundEnabled = false;
function ativarSom(){
  try{
    if(!__audioCtx) __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    __audioCtx.resume && __audioCtx.resume();
    __soundEnabled = true;
    localStorage.setItem('soundEnabled','1');
    alert("Som ativado! Deixe esta aba aberta.");
    beep(0.08, 880);
  }catch(e){
    alert("Não consegui ativar som nesse navegador. Tente clicar novamente.");
  }
}
function beep(duration=0.18, freq=880){
  if(!__soundEnabled) return;
  try{
    if(!__audioCtx) __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = __audioCtx.createOscillator();
    const g = __audioCtx.createGain();
    o.type = "square";
    o.frequency.value = freq;
    g.gain.value = 0.6; // alto
    o.connect(g); g.connect(__audioCtx.destination);
    o.start();
    setTimeout(()=>{ try{o.stop();}catch(e){} }, duration*1000);
  }catch(e){}
}
function playSom(){
  if(!__soundEnabled && localStorage.getItem('soundEnabled')==='1') __soundEnabled = true;
  // alerta mais alto (precisa clicar em "Ativar Som" 1x por navegador)
  const seq = [880, 880, 988, 988, 880, 784];
  seq.forEach((f,i)=> setTimeout(()=>beep(0.18, f), i*190));
}
// ===============================================


  // login simples
  const senha = prompt("Senha do Admin:");
  if(senha !== "19122026"){
    document.body.innerHTML = "<div style='text-align:center;margin-top:60px;color:#ffb3b8;font-family:Montserrat,sans-serif;font-weight:900'>ACESSO NEGADO</div>";
    throw new Error("Senha incorreta");
  }

  let pedidos = [];
  let filtro = "all";
  let showFinal = false;
  let lastSeen = Date.now();
  let somAtivo = false;

  function toTime(ts){
    try{
      if(ts && ts.toDate){
        const d = ts.toDate();
        return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      }
    }catch(e){}
    return "--:--";
  }
  function toDateStr(ts){
    try{
      if(ts && ts.toDate){
        return ts.toDate().toLocaleString();
      }
    }catch(e){}
    return "";
  }
  function badgeStatus(s){
    if(!s) return "recebido";
    if(s==="novo") return "recebido";
    return s;
  }
  function labelStatus(s){
    const m={recebido:"Pedido recebido",preparo:"Em preparo",saiu:"Saiu p/ entrega",finalizado:"Finalizado"};
    return m[s]||"Pedido recebido";
  }
  function statusUrl(id){
    return `${window.location.origin}/status.html?id=${id}`;
  }

  function setFilter(f, el){
    filtro = f;
    document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
    el.classList.add('active');
    render();
  }
  function toggleFinalizados(){
    showFinal = !showFinal;
    render();
  }

  function render(){
    const grid = document.getElementById('grid');
    const q = (document.getElementById('q').value||"").toLowerCase().trim();
    const list = pedidos
      .filter(p=> showFinal ? true : badgeStatus(p.status) !== "finalizado")
      .filter(p=> filtro==="all" ? true : badgeStatus(p.status)===filtro)
      .filter(p=>{
        if(!q) return true;
        const hay = [
          String(p.codigo||""),
          String(p.nome||p.cliente||""),
          String(p.bairro||""),
          String(p.rua||""),
          String(p.servico||"")
        ].join(" ").toLowerCase();
        return hay.includes(q);
      });

    if(list.length===0){
      grid.innerHTML = "<div style='color:#777'>Nenhum pedido aqui.</div>";
      return;
    }

    grid.innerHTML = "";
    list.forEach(p=>{
      const s = badgeStatus(p.status);
      const card = document.createElement('div');
      card.className = 'card';
      const entrega = (p.servico==='delivery' || p.delivery===true);
      const end = entrega ? `${p.rua||""}, ${p.numero||""} • ${p.bairro||""}${p.referencia? " • Ref: "+p.referencia:""}` : (p.servico==='retirada' ? "Retirada" : "No local");
      const pay = p.pagamento ? p.pagamento : "";
      const troco = p.troco ? ` (Troco: ${p.troco})` : "";

      card.innerHTML = `
        <div class="top">
          <div>
            <div class="code">#${p.codigo || "—"}</div>
            <div class="time">${toTime(p.data)} • ${toDateStr(p.data)}</div>
          </div>
          <div class="badge ${s}"><span class="dot"></span><span>${labelStatus(s)}</span></div>
        </div>

        <div class="info">
          <b>${p.nome || p.cliente || "—"}</b><br>
          <span style="color:#bdbdbd">${entrega ? "🛵 " : (p.servico==='retirada'?"👜 ":"🍽️ ")}</span>${end}<br>
          <span style="color:#bdbdbd">💳</span> ${pay}${troco}
        </div>

        <div class="itens">
          ${(p.itens||[]).map(i=>`
            <div class="i">
              <div style="flex:1">
                <div><b>${i.qty}x</b> ${i.name}</div>
                ${i.obs? `<div class="obs">Obs: ${i.obs}</div>`:""}
              </div>
              <div style="font-weight:900;color:var(--primary)">${money((Number(i.price)||0)*Number(i.qty||1))}</div>
            </div>
          `).join("")}
        </div>

        <div class="total"><span>Total</span><span>${p.total || money(p.totalNumber||0)}</span></div>

        <div class="buttons">
          <button class="btn" onclick="imprimir('${p.id}','cozinha')"><i class="fa-solid fa-fire"></i> Cozinha</button>
          <button class="btn" onclick="imprimir('${p.id}','motoboy')"><i class="fa-solid fa-motorcycle"></i> Motoboy</button>
          <button class="btn" onclick="copiarLink('${p.id}')"><i class="fa-solid fa-link"></i> Link Status</button>
        </div>

        <div class="buttons" style="margin-top:8px">
          <button class="btn ok" onclick="mudarStatus('${p.id}','preparo')"><i class="fa-solid fa-fire-burner"></i> Em preparo</button>
          <button class="btn primary" onclick="mudarStatus('${p.id}','saiu')"><i class="fa-solid fa-truck-fast"></i> Saiu</button>
          <button class="btn danger" onclick="mudarStatus('${p.id}','finalizado')"><i class="fa-solid fa-circle-check"></i> Finalizar</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function money(v){
    const n = Number(v);
    if(Number.isNaN(n)) return "";
    return "R$ " + n.toFixed(2).replace('.',',');
  }

  async function mudarStatus(id, status){
    try{
      await db.collection("pedidos").doc(id).update({status});
    }catch(e){
      alert("Erro ao atualizar status.");
      console.log(e);
    }
  }

  async function copiarLink(id){
    const url = statusUrl(id);
    try{
      await navigator.clipboard.writeText(url);
      alert("Link copiado! (Envie para o cliente no WhatsApp)");
    }catch(e){
      prompt("Copie o link:", url);
    }
  }

  async async function imprimir(id, via){
  const doc = await db.collection("pedidos").doc(id).get();
  const p = doc.data() || {};
  const area = document.getElementById('printable');

  const entrega = (p.servico==='delivery' || p.delivery===true);
  const dataHora = (p.data && p.data.toDate) ? p.data.toDate().toLocaleString() : new Date().toLocaleString();

  const frete = (Number.isFinite(Number(p.taxa)) ? Number(p.taxa)
               : Number.isFinite(Number(p.frete)) ? Number(p.frete)
               : Number.isFinite(Number(p.bairroTaxa)) ? Number(p.bairroTaxa)
               : 0);

  const sub = (Number.isFinite(Number(p.subtotal)) ? Number(p.subtotal) : 0);
  const total = (Number.isFinite(Number(p.total)) ? Number(p.total) : (sub + frete));

  const rua = (p.endereco || p.rua || p.ruaNome || '').toString().trim();
  const numero = (p.numero || p.num || '').toString().trim();
  const compl = (p.complemento || '').toString().trim();
  const ref = (p.referencia || '').toString().trim();
  const bairro = (p.bairroNome || p.bairro || '').toString().trim();

  const pag = (p.pagamento || '').toString().trim();
  const trocoPara = (p.troco || '').toString().trim();
  const obsGeral = (p.obsGeral || p.observacoes || '').toString().trim();

  const viaTxt = (via==='moto') ? 'VIA MOTOBOY 🛵' : 'VIA COZINHA 👨‍🍳';

  const itens = Array.isArray(p.itens) ? p.itens : [];
  const itensTxt = itens.map(it => {
    const q = it.qty || it.qtd || 1;
    const nm = it.name || it.nome || '';
    const pr = Number(it.price || it.preco || 0);
    const tot = (pr*q) || 0;
    const obs = (it.obs || '').toString().trim();
    return `<div class="ticket-row">
        <div>${q}x ${escapeHtml(nm)}${obs?`<div class="ticket-mini">Obs: ${escapeHtml(obs)}</div>`:''}</div>
        <div>R$ ${tot.toFixed(2).replace('.',',')}</div>
      </div>`;
  }).join('');

  let html = `
    <div class="ticket-head">
      <div class="ticket-title">MAIS Q HAMBÚRGUER</div>
      <div class="ticket-sub">${viaTxt}</div>
      <div class="ticket-divider"></div>
      <div class="ticket-mini">${dataHora}</div>
    </div>

    <div class="ticket-row"><div><b>Pedido:</b> #${p.codigo || ''}</div><div></div></div>
    <div class="ticket-row"><div><b>Cliente:</b> ${escapeHtml(p.cliente || p.nome || '')}</div><div></div></div>

    ${entrega ? `
      <div class="ticket-divider"></div>
      <div class="ticket-mini"><b>ENTREGA</b></div>
      <div class="ticket-mini"><b>Endereço:</b> ${escapeHtml([rua, numero].filter(Boolean).join(', '))}</div>
      ${compl ? `<div class="ticket-mini"><b>Complemento:</b> ${escapeHtml(compl)}</div>` : ''}
      ${bairro ? `<div class="ticket-mini"><b>Bairro:</b> ${escapeHtml(bairro)}</div>` : ''}
      ${ref ? `<div class="ticket-mini"><b>Referência:</b> ${escapeHtml(ref)}</div>` : ''}
    ` : `
      <div class="ticket-divider"></div>
      <div class="ticket-mini"><b>${p.servico==='retirada' ? 'RETIRADA' : 'NO LOCAL'}</b></div>
    `}

    ${obsGeral ? `<div class="ticket-mini" style="margin-top:6px"><b>Obs geral:</b> ${escapeHtml(obsGeral)}</div>` : ''}

    <div class="ticket-divider"></div>
    ${itensTxt}

    <div class="ticket-divider"></div>
    <div class="ticket-row"><div>Subtotal</div><div>R$ ${sub.toFixed(2).replace('.',',')}</div></div>
    <div class="ticket-row"><div>Entrega</div><div>${frete>0 ? ('R$ '+frete.toFixed(2).replace('.',',')) : 'Grátis'}</div></div>
    <div class="ticket-row" style="font-weight:900"><div>TOTAL</div><div>R$ ${total.toFixed(2).replace('.',',')}</div></div>

    <div class="ticket-divider"></div>
    <div class="ticket-mini"><b>Pagamento:</b> ${escapeHtml(pag || '-')} ${trocoPara ? `(Troco p/ ${escapeHtml(trocoPara)})` : ''}</div>

    <div class="ticket-divider"></div>
    <div style="text-align:center" class="ticket-mini">Obrigado pela preferência!</div>
  `;

  area.innerHTML = html;
  window.print();
}

  function ativarSom(){
    const a = document.getElementById('beep');
    a.volume = 1.0;
    a.currentTime = 0;
    a.play().then(()=>{
      somAtivo = true;
      alert("Som ativado! Agora ele vai tocar quando chegar pedido.");
    }).catch(()=>{
      somAtivo = true;
      alert("Som ativado! (Se não tocar, clique mais uma vez.)");
    });
  }

  function tocarSomForte(){
    if(!somAtivo) return;
    const a = document.getElementById('beep');
    try{
      a.volume = 1.0;
      a.currentTime = 0;
      a.play();
      setTimeout(()=>{a.currentTime=0; a.play().catch(()=>{});}, 900);
    }catch(e){}
  }

  // Escuta em tempo real
  db.collection("pedidos").orderBy("data","desc").onSnapshot((snap)=>{
    const arr = [];
    let temNovo = false;
    snap.forEach(d=>{
      const p = d.data();
      arr.push({...p, id:d.id});
      // novo pedido: criado nos últimos 25s
      try{
        if(p.data && p.data.toDate){
          const ms = p.data.toDate().getTime();
          if(ms > lastSeen && (Date.now() - ms) < 25000) temNovo = true;
        }
      }catch(e){}
    });
    pedidos = arr;
    render();
    if(temNovo) tocarSomForte();
    lastSeen = Date.now();
  });
</script>

</body>
</html>
